[flags]
"-f"               = "output format: lines, codeframe, json-lines (default: lines)"
"-r, --report"     = "write lcov report to file (default path: coverage.lcov)"
"--codeframe"     = "print file:line ranges with source"
"-v, --version"    = "print version and exit"
"-h, --help"       = "print this help and exit"

[env]
"COVERAGE=codeframe" = "force codeframe output regardless of screen size"
"COVERAGE=lines"     = "force lines-only output regardless of screen size"
